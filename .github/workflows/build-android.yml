name: Build Android AAB

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install & Build Web
        run: |
          rm -rf node_modules package-lock.json
          npm install --legacy-peer-deps
          npm install react-is --save --legacy-peer-deps || true
          npm run build
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 cmdline-tools;latest'
          
      - name: Sync Capacitor
        run: npx cap sync android
        
      - name: Prepare Signing Files (Using Python for robust decoding)
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
          KEYSTORE: ${{ secrets.KEYSTORE }}
        run: |
          mkdir -p android/app
          python3 << 'PYEOF'
          import os
          import base64
          import shutil

          # 1. Procesar Google Services (Texto Plano)
          gs = os.environ.get("GOOGLE_SERVICES", "")
          if gs:
              with open("android/app/google-services.json", "w") as f:
                  f.write(gs)
              print("✅ google-services.json creado")

          # 2. Procesar Key Properties (Texto Plano)
          kp = os.environ.get("KEY_PROPERTIES", "")
          if kp:
              # Limpiar saltos de línea de Windows si los hubiera
              kp = kp.replace('\r', '')
              with open("android/key.properties", "w") as f:
                  f.write(kp)
              print("✅ key.properties creado")

          # 3. Procesar KEYSTORE (Base64 Robusto)
          ks_b64 = os.environ.get("KEYSTORE", "")
          if ks_b64:
              # Eliminar TODOS los espacios y saltos de línea invisibles
              ks_clean = "".join(ks_b64.split())
              
              try:
                  # Decodificar Base64
                  ks_bytes = base64.b64decode(ks_clean)
                  
                  # Guardar en carpeta app
                  with open("android/app/elena-release.jks", "wb") as f:
                      f.write(ks_bytes)
                  
                  # Copiar a carpeta raíz (por compatibilidad)
                  shutil.copy("android/app/elena-release.jks", "android/elena-release.jks")
                  
                  print(f"✅ Keystore decodificado exitosamente ({len(ks_bytes)} bytes)")
              except Exception as e:
                  print(f"❌ Error decodificando Keystore: {e}")
                  exit(1)
          else:
              print("⚠️ KEYSTORE no encontrado en secrets")
          PYEOF
          
      - name: Build Signed AAB
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew clean bundleRelease --no-daemon
          
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/bundle/release/app-release.aab
