name: Build Android AAB

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Clean install dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm install --legacy-peer-deps
          
      - name: Install missing peer dependencies
        run: npm install react-is --save --legacy-peer-deps || true
        
      - name: Build web app
        run: npm run build
        
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 cmdline-tools;latest'
          
      - name: Sync Capacitor
        run: npx cap sync android
        
      - name: Create directories
        run: |
          mkdir -p android/app
          mkdir -p android
          
      - name: Decode GOOGLE_SERVICES
        run: |
          echo "🔐 Decodificando google-services.json..."
          SECRET="${{ secrets.GOOGLE_SERVICES }}"
          if [ -z "$SECRET" ]; then
            echo "❌ ERROR: GOOGLE_SERVICES está vacío"
            exit 1
          fi
          # Intentar decodificar
          if echo "$SECRET" | base64 -d > android/app/google-services.json 2>/dev/null; then
            echo "✅ Decodificación exitosa"
            # Validar JSON
            if python3 -c "import json; json.load(open('android/app/google-services.json'))" 2>/dev/null; then
              echo "✅ JSON válido"
            else
              echo "❌ ERROR: El archivo no es JSON válido"
              echo "Primeros 200 caracteres:"
              head -c 200 android/app/google-services.json
              exit 1
            fi
          else
            echo "❌ ERROR: base64 inválido"
            echo "Primeros 50 caracteres del secret:"
            echo "$SECRET" | head -c 50
            echo ""
            exit 1
          fi
          
      - name: Decode KEY_PROPERTIES
        run: |
          echo "🔐 Decodificando key.properties..."
          SECRET="${{ secrets.KEY_PROPERTIES }}"
          if [ -n "$SECRET" ]; then
            echo "$SECRET" | base64 -d > android/key.properties 2>/dev/null || echo "$SECRET" > android/key.properties
            echo "✅ key.properties creado"
            cat android/key.properties
          else
            echo "⚠️ KEY_PROPERTIES no configurado"
          fi
          
      - name: Decode KEYSTORE
        run: |
          echo "🔐 Decodificando keystore..."
          SECRET="${{ secrets.KEYSTORE }}"
          if [ -n "$SECRET" ]; then
            echo "$SECRET" | base64 -d > android/app/elena-release.jks 2>/dev/null || printf '%s' "$SECRET" | base64 -d > android/app/elena-release.jks 2>/dev/null
            if [ -f android/app/elena-release.jks ] && [ -s android/app/elena-release.jks ]; then
              echo "✅ Keystore creado: $(ls -lh android/app/elena-release.jks)"
            else
              echo "⚠️ Keystore puede estar vacío o inválido"
            fi
          else
            echo "⚠️ KEYSTORE no configurado"
          fi
          
      - name: Make gradlew executable
        run: chmod +x android/gradlew
        
      - name: Build AAB
        run: cd android && ./gradlew bundleRelease --no-daemon
        
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/bundle/release/app-release.aab
