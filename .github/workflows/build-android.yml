name: Build Android AAB

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install & Build Web
        run: |
          rm -rf node_modules package-lock.json
          npm install --legacy-peer-deps
          npm install react-is --save --legacy-peer-deps || true
          npm run build
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 cmdline-tools;latest'
          
      - name: Sync Capacitor
        run: npx cap sync android
        
      - name: Prepare Signing Files
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
          KEYSTORE: ${{ secrets.KEYSTORE }}
        run: |
          mkdir -p android/app
          python3 << 'PYEOF'
          import os, json, base64, shutil, re

          def clean_value(val):
              """Limpia saltos de línea y espacios invisibles"""
              return val.replace('\r', '').replace('\n', ' ').strip()

          def try_decode_base64(val):
              """Intenta decodificar Base64, si falla devuelve el valor original"""
              try:
                  clean = "".join(val.split())  # Elimina TODOS los espacios
                  return base64.b64decode(clean)
              except:
                  return None

          # === 1. GOOGLE_SERVICES ===
          gs = os.environ.get("GOOGLE_SERVICES", "")
          if gs:
              gs_clean = clean_value(gs)
              
              # Intentar decodificar si parece Base64
              if re.match(r'^[A-Za-z0-9+/=]+$', gs_clean.replace(' ', '')):
                  decoded = try_decode_base64(gs_clean)
                  if decoded:
                      try:
                          # Validar que sea JSON
                          json.loads(decoded.decode('utf-8'))
                          with open("android/app/google-services.json", "wb") as f:
                              f.write(decoded)
                          print("✅ google-services.json decodificado desde Base64")
                      except:
                          # Si no es JSON válido, guardar como texto plano
                          with open("android/app/google-services.json", "w") as f:
                              f.write(gs_clean)
                          print("✅ google-services.json guardado como texto plano")
                  else:
                      with open("android/app/google-services.json", "w") as f:
                          f.write(gs_clean)
              else:
                  # No parece Base64, guardar como texto plano
                  with open("android/app/google-services.json", "w") as f:
                      f.write(gs_clean)
              
              # Validación final
              try:
                  with open("android/app/google-services.json", "r") as f:
                      json.load(f)
                  print("✅ google-services.json es JSON válido")
              except json.JSONDecodeError as e:
                  print(f"❌ ERROR: JSON inválido: {e}")
                  print("Contenido parcial:", open("android/app/google-services.json").read(200))
                  exit(1)

          # === 2. KEY_PROPERTIES ===
          kp = os.environ.get("KEY_PROPERTIES", "")
          if kp:
              with open("android/key.properties", "w") as f:
                  f.write(clean_value(kp))
              print("✅ key.properties creado")

          # === 3. KEYSTORE (Base64 obligatorio) ===
          ks = os.environ.get("KEYSTORE", "")
          if ks:
              ks_clean = "".join(ks.split())  # Eliminar TODOS los espacios
              try:
                  ks_bytes = base64.b64decode(ks_clean)
                  with open("android/app/elena-release.jks", "wb") as f:
                      f.write(ks_bytes)
                  shutil.copy("android/app/elena-release.jks", "android/elena-release.jks")
                  print(f"✅ Keystore decodificado ({len(ks_bytes)} bytes)")
              except Exception as e:
                  print(f"❌ Error con Keystore: {e}")
                  exit(1)
          PYEOF
          
      - name: Build Signed AAB
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew clean bundleRelease --no-daemon
          
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/bundle/release/app-release.aab
