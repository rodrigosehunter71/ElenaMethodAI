name: Build Android AAB

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Clean install dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm install --legacy-peer-deps
          
      - name: Install missing peer dependencies
        run: npm install react-is --save --legacy-peer-deps || true
        
      - name: Build web app
        run: npm run build
        
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 cmdline-tools;latest'
          
      - name: Sync Capacitor
        run: npx cap sync android
        
      - name: Create android directories
        run: |
          mkdir -p android/app
          mkdir -p android
          ls -la android/
          
      - name: Decode GOOGLE_SERVICES
        run: |
          echo "Decoding google-services.json..."
          if [ -n "${{ secrets.GOOGLE_SERVICES }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES }}" | base64 -d > android/app/google-services.json
            echo "✅ google-services.json creado"
            head -c 100 android/app/google-services.json
            echo ""
          else
            echo "⚠️ GOOGLE_SERVICES secret no está configurado"
          fi
          
      - name: Decode KEY_PROPERTIES
        run: |
          echo "Decoding key.properties..."
          if [ -n "${{ secrets.KEY_PROPERTIES }}" ]; then
            echo "${{ secrets.KEY_PROPERTIES }}" | base64 -d > android/key.properties
            echo "✅ key.properties creado"
            cat android/key.properties
          else
            echo "⚠️ KEY_PROPERTIES secret no está configurado"
          fi
          
      - name: Decode KEYSTORE
        run: |
          echo "Decoding keystore..."
          if [ -n "${{ secrets.KEYSTORE }}" ]; then
            echo "${{ secrets.KEYSTORE }}" | base64 -d > android/app/elena-release.jks
            echo "✅ Keystore creado"
            ls -lh android/app/elena-release.jks
          else
            echo "⚠️ KEYSTORE secret no está configurado"
          fi
          
      - name: Verify config files
        run: |
          echo "=== Verificando archivos de configuración ==="
          ls -lh android/app/google-services.json android/key.properties android/app/elena-release.jks 2>&1 || true
          echo "=== Validando google-services.json ==="
          python3 -c "import json; json.load(open('android/app/google-services.json')); print('✅ JSON válido')" 2>&1 || echo "❌ JSON inválido"
          
      - name: Make gradlew executable
        run: chmod +x android/gradlew
        
      - name: Build AAB
        run: cd android && ./gradlew bundleRelease --no-daemon
        
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/bundle/release/app-release.aab
