name: Build Android AAB

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Clean install dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm install --legacy-peer-deps
          
      - name: Install missing peer dependencies
        run: npm install react-is --save --legacy-peer-deps || true
        
      - name: Build web app
        run: npm run build
        
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 cmdline-tools;latest'
          
      - name: Sync Capacitor
        run: npx cap sync android
        
      - name: Create directories
        run: mkdir -p android/app
        
      - name: Process Secrets (Encoding-Proof)
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
          KEYSTORE: ${{ secrets.KEYSTORE }}
        run: |
          python3 << 'PYEOF'
          import os, base64, re

          def decode_smart(val):
              val = val.strip()
              # Si parece Base64 (solo letras, números, +, /, =, espacios)
              if re.match(r'^[A-Za-z0-9+/=\s]+$', val):
                  try:
                      # Rellenar padding si falta
                      clean = val.replace('\n','').replace('\r','').replace(' ','')
                      pad = 4 - len(clean) % 4
                      if pad != 4: val += '=' * pad
                      return base64.b64decode(val)
                  except:
                      pass
              # Fallback: tratar como texto plano, escribir bytes seguros
              return val.encode('utf-8', errors='replace')

          # 1. GOOGLE_SERVICES
          gs = os.getenv("GOOGLE_SERVICES", "")
          if gs:
              with open("android/app/google-services.json", "wb") as f:
                  f.write(decode_smart(gs))
              print("✅ google-services.json creado")

          # 2. KEY_PROPERTIES
          kp = os.getenv("KEY_PROPERTIES", "")
          if kp:
              data = decode_smart(kp)
              with open("android/key.properties", "wb") as f:
                  f.write(data)
              print("✅ key.properties creado")
              # Mostrar contenido seguro para debug
              try: print(data.decode('utf-8'))
              except: print("(contenido no texto)")

          # 3. KEYSTORE
          ks = os.getenv("KEYSTORE", "")
          if ks:
              data = decode_smart(ks)
              with open("android/elena-release.jks", "wb") as f:
                  f.write(data)
              print(f"✅ Keystore guardado en android/ ({len(data)} bytes)")
              with open("android/app/elena-release.jks", "wb") as f:
                  f.write(data)
              print("✅ Copia en android/app/")
          PYEOF
          
      - name: Verify files & Keystore
        run: |
          echo "=== Archivos generados ==="
          ls -lh android/key.properties android/elena-release.jks android/app/elena-release.jks 2>&1 || true
          echo ""
          echo "=== key.properties ==="
          cat android/key.properties 2>/dev/null || echo "No existe"
          echo ""
          if [ -f android/elena-release.jks ]; then
            echo "=== Verificando firma del keystore ==="
            KEYSTORE_PATH="android/elena-release.jks"
            STORE_PASS=$(grep storePassword android/key.properties | cut -d= -f2 | tr -d '\r\n ')
            if [ -n "$STORE_PASS" ]; then
              keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASS" 2>&1 | head -3
            else
              echo "⚠️ No se encontró storePassword en key.properties"
            fi
          fi
          
      - name: Make gradlew executable
        run: chmod +x android/gradlew
        
      - name: Build AAB
        run: cd android && ./gradlew clean bundleRelease --no-daemon
        
      - name: Verify AAB & Upload
        run: |
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          if [ -f "$AAB" ]; then
            echo "✅ AAB generado: $(ls -lh $AAB)"
            echo "Verificando firma..."
            unzip -l "$AAB" | grep "META-INF" | head -3 || echo "⚠️ No se encontraron metadatos de firma"
          else
            echo "❌ ERROR: No se generó el AAB"
            exit 1
          fi
        if: always()
        
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/bundle/release/app-release.aab
