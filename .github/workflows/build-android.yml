name: Build Android AAB

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Clean install dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm install --legacy-peer-deps
          
      - name: Install missing peer dependencies
        run: npm install react-is --save --legacy-peer-deps || true
        
      - name: Build web app
        run: npm run build
        
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 cmdline-tools;latest'
          
      - name: Sync Capacitor
        run: npx cap sync android
        
      - name: Create directories
        run: |
          mkdir -p android/app
          mkdir -p android
          
      - name: Process GOOGLE_SERVICES (Base64 or Plain Text)
        run: |
          echo " Procesando google-services.json..."
          SECRET="${{ secrets.GOOGLE_SERVICES }}"
          
          if [ -z "$SECRET" ]; then
            echo " ERROR: GOOGLE_SERVICES está vacío"
            exit 1
          fi
          
          # Intentar decodificar como base64
          if printf '%s' "$SECRET" | base64 -d > android/app/google-services.json 2>/dev/null; then
            echo "✅ Decodificado como Base64 exitosamente"
          else
            echo "⚠️ Falló Base64, guardando como Texto Plano..."
            printf '%s' "$SECRET" > android/app/google-services.json
            echo "✅ Guardado como Texto Plano"
          fi
          
          # Validar JSON
          if python3 -c "import json; json.load(open('android/app/google-services.json'))" 2>/dev/null; then
            echo "✅ google-services.json es JSON válido"
          else
            echo "❌ ERROR: El archivo resultante NO es JSON válido"
            echo "Contenido (primeros 100 chars):"
            head -c 100 android/app/google-services.json
            exit 1
          fi
          
      - name: Process KEY_PROPERTIES (Base64 or Plain Text)
        run: |
          echo "🔐 Procesando key.properties..."
          SECRET="${{ secrets.KEY_PROPERTIES }}"
          
          if [ -n "$SECRET" ]; then
            if printf '%s' "$SECRET" | base64 -d > android/key.properties 2>/dev/null; then
              echo "✅ Decodificado como Base64"
            else
              printf '%s' "$SECRET" > android/key.properties
              echo "✅ Guardado como Texto Plano"
            fi
            echo "Contenido:"
            cat android/key.properties
          else
            echo "⚠️ KEY_PROPERTIES no configurado"
          fi
          
      - name: Process KEYSTORE (Base64 or Plain Text)
        run: |
          echo "🔐 Procesando keystore..."
          SECRET="${{ secrets.KEYSTORE }}"
          
          if [ -n "$SECRET" ]; then
            if printf '%s' "$SECRET" | base64 -d > android/app/elena-release.jks 2>/dev/null; then
              echo "✅ Keystore decodificado como Base64"
            else
              printf '%s' "$SECRET" > android/app/elena-release.jks
              echo "⚠️ Keystore guardado como Texto Plano (podría fallar firma)"
            fi
            
            if [ -f android/app/elena-release.jks ] && [ -s android/app/elena-release.jks ]; then
              echo "✅ Archivo keystore existe y no está vacío: $(ls -lh android/app/elena-release.jks)"
            else
              echo "❌ ERROR: Keystore vacío o no creado"
            fi
          else
            echo "⚠️ KEYSTORE no configurado"
          fi
          
      - name: Make gradlew executable
        run: chmod +x android/gradlew
        
      - name: Build AAB
        run: cd android && ./gradlew bundleRelease --no-daemon
        
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/bundle/release/app-release.aab
