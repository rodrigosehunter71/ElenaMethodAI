name: Build Android AAB

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Clean install dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm install --legacy-peer-deps
          
      - name: Install missing peer dependencies
        run: npm install react-is --save --legacy-peer-deps || true
        
      - name: Build web app
        run: npm run build
        
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 cmdline-tools;latest'
          
      - name: Sync Capacitor
        run: npx cap sync android
        
      - name: Copy config files
        run: |
          mkdir -p android/app android
          
          # GOOGLE_SERVICES - decodificación robusta
          if [ -n "${{ secrets.GOOGLE_SERVICES }}" ]; then
            echo -n '${{ secrets.GOOGLE_SERVICES }}' | base64 -d > android/app/google-services.json 2>/dev/null
            # Validar que sea JSON válido
            if ! python3 -c "import json; json.load(open('android/app/google-services.json'))" 2>/dev/null; then
              echo "⚠️ google-services.json no es JSON válido, intentando fallback..."
              echo '${{ secrets.GOOGLE_SERVICES }}' > android/app/google-services.json
            fi
          fi
          
          # KEY_PROPERTIES - decodificación robusta
          if [ -n "${{ secrets.KEY_PROPERTIES }}" ]; then
            echo -n '${{ secrets.KEY_PROPERTIES }}' | base64 -d > android/key.properties 2>/dev/null || echo '${{ secrets.KEY_PROPERTIES }}' > android/key.properties
          fi
          
          # KEYSTORE - decodificación robusta
          if [ -n "${{ secrets.KEYSTORE }}" ]; then
            echo -n '${{ secrets.KEYSTORE }}' | base64 -d > android/app/elena-release.jks 2>/dev/null || printf '%s' '${{ secrets.KEYSTORE }}' | base64 -d > android/app/elena-release.jks 2>/dev/null || echo "⚠️ Warning: Keystore may not be valid"
          fi
          
          # Debug: mostrar info de los archivos (sin contenido sensible)
          echo "📁 google-services.json size: $(wc -c < android/app/google-services.json 2>/dev/null || echo 'N/A') bytes"
          echo "📁 key.properties exists: $(test -f android/key.properties && echo 'yes' || echo 'no')"
          echo "📁 elena-release.jks size: $(wc -c < android/app/elena-release.jks 2>/dev/null || echo 'N/A') bytes"
          
      - name: Make gradlew executable
        run: chmod +x android/gradlew
        
      - name: Build AAB
        run: cd android && ./gradlew bundleRelease
        
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/bundle/release/app-release.aab
