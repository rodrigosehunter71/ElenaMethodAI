name: Build Android AAB

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Clean install dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm install --legacy-peer-deps
          
      - name: Install missing peer dependencies
        run: npm install react-is --save --legacy-peer-deps || true
        
      - name: Build web app
        run: npm run build
        
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 cmdline-tools;latest'
          
      - name: Sync Capacitor
        run: npx cap sync android
        
      - name: Create directories
        run: mkdir -p android/app
        
      - name: Process GOOGLE_SERVICES only
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
        run: |
          if [ -n "$GOOGLE_SERVICES" ]; then
            echo "$GOOGLE_SERVICES" | base64 -d > android/app/google-services.json 2>/dev/null || echo "$GOOGLE_SERVICES" > android/app/google-services.json
            echo "✅ google-services.json creado"
          fi
          
      - name: Generate NEW Keystore (Fresh)
        run: |
          echo "🔐 Generando keystore nuevo..."
          keytool -genkey -v \
            -keystore android/app/elena-release.jks \
            -alias elena-key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass elena123 \
            -keypass elena123 \
            -dname "CN=Elena Method AI, OU=Mobile, O=ElenaAI, L=City, S=State, C=US"
          echo "✅ Keystore generado exitosamente"
          ls -lh android/app/elena-release.jks
          
      - name: Create key.properties
        run: |
          cat > android/key.properties << 'EOF'
storePassword=elena123
keyPassword=elena123
keyAlias=elena-key
storeFile=elena-release.jks
EOF
          echo "✅ key.properties creado:"
          cat android/key.properties
          
      - name: Make gradlew executable
        run: chmod +x android/gradlew
        
      - name: Build SIGNED AAB
        run: |
          cd android
          echo "Compilando AAB firmado..."
          ./gradlew clean bundleRelease --no-daemon
          
      - name: Verify AAB Signature
        run: |
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          if [ -f "$AAB" ]; then
            echo "✅ AAB generado: $(ls -lh $AAB)"
            echo "Verificando firma..."
            jarsigner -verify -verbose -certs "$AAB" 2>&1 | grep "signed by" || echo "⚠️ Verificación manual necesaria"
          else
            echo "❌ ERROR: No se generó el AAB"
            exit 1
          fi
          
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/bundle/release/app-release.aab
