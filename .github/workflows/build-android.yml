name: Build Android AAB

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Clean install dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm install --legacy-peer-deps
          
      - name: Install missing peer dependencies
        run: npm install react-is --save --legacy-peer-deps || true
        
      - name: Build web app
        run: npm run build
        
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 cmdline-tools;latest'
          
      - name: Sync Capacitor
        run: npx cap sync android
        
      - name: Create directories
        run: mkdir -p android/app
        
      - name: Process Secrets
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
          KEYSTORE: ${{ secrets.KEYSTORE }}
        run: |
          python3 << 'PYEOF'
          import os, json, base64
          
          def decode_secret(name, val):
              val = val.strip()
              try:
                  # Fix padding
                  pad = 4 - len(val) % 4
                  if pad != 4: val += "=" * pad
                  return base64.b64decode(val)
              except:
                  return val.encode()
          
          # GOOGLE_SERVICES
          gs = os.getenv("GOOGLE_SERVICES", "")
          if gs:
              with open("android/app/google-services.json", "wb") as f:
                  f.write(decode_secret("GOOGLE_SERVICES", gs))
              print("✅ google-services.json creado")
          
          # KEY_PROPERTIES - DECÓDIFICALO Y MUESTRALO
          kp = os.getenv("KEY_PROPERTIES", "")
          if kp:
              kp_content = decode_secret("KEY_PROPERTIES", kp).decode() if isinstance(decode_secret("KEY_PROPERTIES", kp), bytes) else kp
              with open("android/key.properties", "w") as f:
                  f.write(kp_content)
              print("✅ key.properties creado:")
              print(kp_content)
              print("---")
          
          # KEYSTORE
          ks = os.getenv("KEYSTORE", "")
          if ks:
              ks_data = decode_secret("KEYSTORE", ks)
              # Guardar en android/ (raíz)
              with open("android/elena-release.jks", "wb") as f:
                  f.write(ks_data)
              print(f"✅ Keystore guardado en android/elena-release.jks ({len(ks_data)} bytes)")
              
              # También en android/app/ por si acaso
              with open("android/app/elena-release.jks", "wb") as f:
                  f.write(ks_data)
              print("✅ Copia en android/app/elena-release.jks")
          PYEOF
          
      - name: Verify files
        run: |
          echo "=== Verificando archivos ==="
          ls -lh android/key.properties android/elena-release.jks android/app/elena-release.jks 2>&1 || true
          echo ""
          echo "=== Contenido de key.properties ==="
          cat android/key.properties 2>/dev/null || echo "No existe"
          echo ""
          echo "=== Verificando keystore ==="
          if [ -f android/elena-release.jks ]; then
            keytool -list -keystore android/elena-release.jks -storepass $(grep storePassword android/key.properties | cut -d= -f2) 2>&1 | head -5 || echo "No se puede leer"
          fi
          
      - name: Make gradlew executable
        run: chmod +x android/gradlew
        
      - name: Build AAB
        run: |
          cd android
          echo "Iniciando build firmado..."
          ./gradlew clean bundleRelease --no-daemon --stacktrace
          
      - name: Verify AAB signature
        run: |
          AAB_PATH="android/app/build/outputs/bundle/release/app-release.aab"
          if [ -f "$AAB_PATH" ]; then
            echo "✅ AAB generado: $(ls -lh $AAB_PATH)"
            # Verificar si está firmado
            unzip -l "$AAB_PATH" | grep -i "META-INF" | head -5 || echo "⚠️ No se encuentran archivos de firma"
          else
            echo "❌ ERROR: No se generó el AAB"
            find android/app/build/outputs -name "*.aab" 2>/dev/null || echo "No hay AABs en outputs"
          fi
          
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/bundle/release/app-release.aab
