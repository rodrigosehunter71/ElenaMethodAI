name: Build Android AAB

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install & Build Web
        run: |
          rm -rf node_modules package-lock.json
          npm install --legacy-peer-deps
          npm install react-is --save --legacy-peer-deps || true
          npm run build
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 cmdline-tools;latest'
          
      - name: Sync Capacitor
        run: npx cap sync android
        
      - name: Prepare Signing Files
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
          KEYSTORE: ${{ secrets.KEYSTORE }}
        run: |
          mkdir -p android/app
          
          # Decodificar google-services.json
          if [ -n "$GOOGLE_SERVICES" ]; then
            printf '%s' "$GOOGLE_SERVICES" | base64 -d | tr -d '\r' > android/app/google-services.json
            echo "✅ google-services.json listo"
          fi
          
          # Decodificar key.properties (quita saltos de línea de Windows)
          if [ -n "$KEY_PROPERTIES" ]; then
            printf '%s' "$KEY_PROPERTIES" | base64 -d | tr -d '\r' > android/key.properties
            echo "✅ key.properties listo:"
            cat android/key.properties
          fi
          
          # Decodificar keystore (guarda en ambas rutas por compatibilidad)
          if [ -n "$KEYSTORE" ]; then
            printf '%s' "$KEYSTORE" | base64 -d > android/app/elena-release.jks
            cp android/app/elena-release.jks android/elena-release.jks
            echo "✅ Keystore listo en android/app/ y android/"
          fi
          
      - name: Build Signed AAB
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew clean bundleRelease --no-daemon
          
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/bundle/release/app-release.aab
