name: Build Android AAB

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Clean install dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm install --legacy-peer-deps
          
      - name: Install missing peer dependencies
        run: npm install react-is --save --legacy-peer-deps || true
        
      - name: Build web app
        run: npm run build
        
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 cmdline-tools;latest'
          
      - name: Sync Capacitor
        run: npx cap sync android
        
      - name: Create directories
        run: |
          mkdir -p android/app
          mkdir -p android
          
      - name: Process GOOGLE_SERVICES
        run: |
          echo "🔐 Procesando google-services.json..."
          SECRET="${{ secrets.GOOGLE_SERVICES }}"
          
          if [ -z "$SECRET" ]; then
            echo "❌ ERROR: GOOGLE_SERVICES está vacío"
            exit 1
          fi
          
          # LIMPIEZA CRÍTICA: Elimina saltos de línea y espacios que rompen base64
          CLEAN_SECRET=$(echo "$SECRET" | tr -d '\n\r ')
          
          # Detectar si es base64 o texto plano
          # Si empieza con "ew0K" o "eyJ" es base64, si empieza con "{" es JSON
          FIRST_CHARS=$(echo "$CLEAN_SECRET" | head -c 4)
          
          if echo "$FIRST_CHARS" | grep -qE "ew0K|eyJ"; then
            echo " Detectado: formato base64"
            # Decodificar usando el string limpio
            echo "$CLEAN_SECRET" | base64 -d > android/app/google-services.json
          else
            echo "📄 Detectado: formato JSON (texto plano)"
            echo "$CLEAN_SECRET" > android/app/google-services.json
          fi
          
          # Validar JSON
          if python3 -c "import json; json.load(open('android/app/google-services.json'))" 2>/dev/null; then
            echo "✅ google-services.json válido"
          else
            echo " ERROR: JSON inválido o archivo corrupto"
            echo "Contenido (primeros 100 chars):"
            head -c 100 android/app/google-services.json
            echo ""
            exit 1
          fi
          
      - name: Process KEY_PROPERTIES
        run: |
          echo "🔐 Procesando key.properties..."
          SECRET="${{ secrets.KEY_PROPERTIES }}"
          
          if [ -n "$SECRET" ]; then
            CLEAN_SECRET=$(echo "$SECRET" | tr -d '\n\r ')
            FIRST_CHARS=$(echo "$CLEAN_SECRET" | head -c 4)
            if echo "$FIRST_CHARS" | grep -qE "ew0K|eyJ"; then
              echo "$CLEAN_SECRET" | base64 -d > android/key.properties
            else
              echo "$CLEAN_SECRET" > android/key.properties
            fi
            echo "✅ key.properties creado"
            cat android/key.properties
          else
            echo "⚠️ KEY_PROPERTIES no configurado"
          fi
          
      - name: Process KEYSTORE
        run: |
          echo "🔐 Procesando keystore..."
          SECRET="${{ secrets.KEYSTORE }}"
          
          if [ -n "$SECRET" ]; then
            CLEAN_SECRET=$(echo "$SECRET" | tr -d '\n\r ')
            FIRST_CHARS=$(echo "$CLEAN_SECRET" | head -c 4)
            if echo "$FIRST_CHARS" | grep -qE "ew0K|eyJ"; then
              echo "$CLEAN_SECRET" | base64 -d > android/app/elena-release.jks
            else
              echo "$CLEAN_SECRET" > android/app/elena-release.jks
            fi
            if [ -f android/app/elena-release.jks ] && [ -s android/app/elena-release.jks ]; then
              echo "✅ Keystore creado: $(ls -lh android/app/elena-release.jks)"
            else
              echo "⚠️ Keystore puede estar vacío"
            fi
          else
            echo "️ KEYSTORE no configurado"
          fi
          
      - name: Make gradlew executable
        run: chmod +x android/gradlew
        
      - name: Build AAB
        run: cd android && ./gradlew bundleRelease --no-daemon
        
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/bundle/release/app-release.aab
