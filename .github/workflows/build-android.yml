name: Build Android AAB

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Clean install dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm install --legacy-peer-deps
          
      - name: Install missing peer dependencies
        run: npm install react-is --save --legacy-peer-deps || true
        
      - name: Build web app
        run: npm run build
        
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 cmdline-tools;latest'
          
      - name: Sync Capacitor
        run: npx cap sync android
        
      - name: Create directories
        run: |
          mkdir -p android/app
          mkdir -p android
          
      # PASO CLAVE: Script inteligente para manejar Secrets corruptos o en texto plano
      - name: Process Secrets (Smart Decoder)
        run: |
          python3 << 'EOF'
import os, json, base64, sys

def process_secret(secret_name, output_path, is_json_check=True):
    secret = os.environ.get(secret_name, "")
    if not secret:
        print(f"⚠️ {secret_name} no está configurado")
        return

    secret = secret.strip()
    print(f"🔐 Procesando {secret_name} (Longitud: {len(secret)})...")

    # Intento 1: Decodificar Base64
    try:
        # Agregamos padding '=' si falta para evitar error de Python
        padding = 4 - len(secret) % 4
        if padding != 4:
            secret += "=" * padding
            
        decoded_bytes = base64.b64decode(secret)
        with open(output_path, "wb") as f:
            f.write(decoded_bytes)
        print(f"✅ {secret_name} decodificado exitosamente desde Base64")
    except Exception as e:
        print(f"️ Falló Base64 ({e}), intentando guardar como texto plano...")
        # Intento 2: Guardar como texto plano
        with open(output_path, "w") as f:
            f.write(secret)
        print(f"✅ {secret_name} guardado como texto plano")

    # Validación final
    if is_json_check:
        try:
            with open(output_path, "r") as f:
                json.load(f)
            print(f"✅ {os.path.basename(output_path)} es JSON válido")
        except json.JSONDecodeError:
            print(f"❌ ERROR: {os.path.basename(output_path)} NO es JSON válido")
            print("Contenido parcial:", open(output_path).read(200))
            sys.exit(1)
    else:
        print(f"✅ {os.path.basename(output_path)} creado correctamente")

# Ejecutar para cada secret
process_secret("GOOGLE_SERVICES", "android/app/google-services.json")
process_secret("KEY_PROPERTIES", "android/key.properties", is_json_check=False)
process_secret("KEYSTORE", "android/app/elena-release.jks", is_json_check=False)

# Verificar tamaños
for f in ["android/app/google-services.json", "android/key.properties", "android/app/elena-release.jks"]:
    if os.path.exists(f):
        print(f"📁 {f}: {os.path.getsize(f)} bytes")
EOF
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
          KEYSTORE: ${{ secrets.KEYSTORE }}

      - name: Make gradlew executable
        run: chmod +x android/gradlew
        
      - name: Build AAB
        run: cd android && ./gradlew bundleRelease --no-daemon
        
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/bundle/release/app-release.aab
